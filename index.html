<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9f1f4;--card:#fff;--ink:#12263a;--mute:#5b6f80;--line:#c6d6df;--acc:#2447d6;--acc-ink:#fff;--ok:#16895a;--bad:#c93a52;--sea:#cfe3ee;--land:#f6f3e4;--pin:#e89b00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b28;--card:#152838;--ink:#e6eef3;--mute:#8ea4b5;--line:#2a4256;--acc:#6f8cff;--acc-ink:#0d1b28;--ok:#3fc08a;--bad:#ff7088;--sea:#0f2434;--land:#223a4c;--pin:#ffb62e}}
:root[data-theme="dark"]{--bg:#0d1b28;--card:#152838;--ink:#e6eef3;--mute:#8ea4b5;--line:#2a4256;--acc:#6f8cff;--acc-ink:#0d1b28;--ok:#3fc08a;--bad:#ff7088;--sea:#0f2434;--land:#223a4c;--pin:#ffb62e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font:800 clamp(26px,5vw,38px)/1.05 "Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
nav{display:flex;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:3px}
nav button{border:0;background:none;color:var(--ink);font:inherit;font-weight:700;padding:8px 18px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.theme{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.theme:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.theme b{display:block;font-size:18px}.theme span{color:var(--mute);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:6px}
.q{font-size:clamp(20px,3.6vw,26px);font-weight:700;line-height:1.25;margin:0 0 16px;max-width:30em}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 16px;text-align:left;font:inherit;font-size:17px;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.end{text-align:center;padding:28px 8px}
.big{font:800 64px/1 "Arial Rounded MT Bold",system-ui,sans-serif}
.clue{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.clue small{color:var(--mute);display:block}
.clue b{font-size:19px}
.mapbox{position:relative;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--sea);aspect-ratio:2/1;touch-action:none;cursor:crosshair}
.mapbox svg{display:block;width:100%;height:100%}
.land{fill:var(--land);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.grid{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.7}
.link{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.zoom{position:absolute;right:8px;top:8px;display:grid;gap:6px}
.zoom button{width:34px;height:34px;border-radius:9px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer}
.res{min-height:52px;margin-top:12px}
.res b{font-size:18px}
.score{font-weight:700}
.stage{border:2px solid var(--ink);border-radius:18px;padding:18px;color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.stage.end{padding:28px 16px;text-align:center}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.sh b{font-size:19px}
.back{background:none;border:0;color:var(--ink);font:inherit;text-decoration:underline;cursor:pointer;padding:4px}
.stage .meta,.stage .sub{color:var(--mute)}
.theme .ti{display:block;font-size:30px;line-height:1.2;color:inherit}
.theme.add{border-style:dashed;box-shadow:none;background:transparent;color:var(--ink);min-height:110px}
.cw{position:relative;display:grid}
.cw .theme{height:100%}
.ed{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:9px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.react{min-height:44px;margin-top:14px;font-weight:700;font-size:18px}
.react.yes{color:var(--ok)}
.err{color:var(--bad)}
.react.pop span{display:inline-block;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.f{display:grid;gap:6px;margin-bottom:14px}
.f>span,.f>label{font-weight:700}
.stage input[type=text],.stage textarea{width:100%;font:inherit;padding:8px 10px;border-radius:9px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.stage input.inv{border-color:var(--bad)}
.tw{overflow-x:auto}
.tw table{border-collapse:collapse;min-width:760px;width:100%}
.tw th{text-align:left;font-size:13px;color:var(--mute);padding:2px 4px}
.tw td{padding:3px}
.tw td:first-child input{min-width:220px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--ink)}
.pick button.on{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.pick .sw{border-radius:50%}
:root{--riv:#2f7fbf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--riv:#6fb4ff}}
:root[data-theme="dark"]{--riv:#6fb4ff}
.sea{fill:var(--sea);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.riv{fill:none;stroke:var(--riv);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.rhl{fill:none;stroke:var(--ok);stroke-width:4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.clue .hint{display:block;color:var(--mute);font-size:14px}
[hidden]{display:none!important}

.terr{fill:#16895a33;stroke:var(--ok);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.qi{display:block;max-width:100%;max-height:260px;margin:0 0 14px;border-radius:12px;border:2px solid var(--line);object-fit:contain;background:#fff}

.ic{white-space:nowrap}

.filelb{display:inline-block;cursor:pointer}

async function saveFile(name,text,box){
  let d=null;try{d=window.claude&&await window.claude.use("downloads")}catch(e){}
  if(d){try{await d.save({filename:name,data:text});return "Файл збережено."}catch(e){if(e&&e.code=="declined")return "Збереження скасовано."}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/octet-stream"}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return "Файл збережено."}catch(e){}
  box.innerHTML=`<div class="f"><label>Прямо тут зберегти файл не вдалося. Скопіюйте цей текст і вставте його у файл ${esc(name)}:</label><textarea rows="5" readonly>${esc(text)}</textarea></div>`;return "";
}

function importData(t){
  let d;try{d=JSON.parse(t)}catch(e){return "Це не схоже на файл із запитаннями."}
  let nt=0,nm=0;
  (d.themes||[]).forEach(x=>{
    const qs=(x.qs||[]).map(q=>Array.isArray(q)?{q:q[0],o:q.slice(1)}:q).filter(q=>q&&q.q&&Array.isArray(q.o)&&q.o.length>1)
      .map(q=>({q:clean(q.q),o:q.o.slice(0,4).map(clean),...(typeof q.img=="string"&&q.img.startsWith("data:image/")?{img:q.img}:{})}));
    if(!x.name||!qs.length)return;
    const t={name:clean(x.name).slice(0,30),icon:clean(x.icon||"📚").slice(0,8),color:/^#[0-9a-f]{6}$/i.test(x.color)?x.color:COL[3],qs};
    const i=C.findIndex(c=>c.name==t.name);if(i>=0)C[i]=t;else C.push(t);nt++});
  (d.map||[]).forEach(m=>{
    if(!m||!m.n||typeof m.x!="number"||typeof m.y!="number")return;
    const t={n:clean(m.n).slice(0,40),c:clean(m.c),x:Math.max(-180,Math.min(180,m.x)),y:Math.max(-90,Math.min(90,m.y)),r:Math.max(0,Math.min(1500,+m.r||0))};
    const i=CM.findIndex(c=>c.n==t.n);if(i>=0)CM[i]=t;else CM.push(t);nm++});
  if(!nt&&!nm)return "У файлі не знайдено запитань.";
  saveC();saveM();return `Завантажено: тем — ${nt}, питань на карті — ${nm}.`;
}
function bindFile(root,after){
  const fm=root.querySelector(".fm"),fx=root.querySelector(".fx");
  root.querySelector("[data-f=out]").onclick=async()=>{
    if(!C.length&&!CM.length){fm.textContent="Спочатку створіть власну тему або питання на карті.";return}
    const m=await saveFile("my-quiz-questions.json",JSON.stringify({app:"quiz-geo",v:1,themes:C,map:CM}),fx);fm.textContent=m};
  root.querySelector("[data-f=in]").onchange=e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>after(importData(r.result));r.onerror=()=>{fm.textContent="Не вдалося прочитати файл."};r.readAsText(f)};
}
function shrink(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};
    im.onerror=()=>cb(null);im.src=fr.result};
  fr.onerror=()=>cb(null);fr.readAsDataURL(file);
}

function burst(x,y,n,em){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  for(let i=0;i<n;i++){const s=document.createElement("span"),a=Math.random()*6.283,d=70+Math.random()*130;
    s.textContent=em[i%em.length];s.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:${16+Math.random()*16}px;pointer-events:none;z-index:99`;
    document.body.appendChild(s);
    s.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d+70}px)) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:900+Math.random()*600,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>s.remove();}
}

function startQuiz(t){
  const qs=sh(t.qs).slice(0,10),fx=["🎉","✨",t.icon];let i=0,ok=0,run=0;

    Q.innerHTML=`<section class="stage" style="${t.st}"><div class="sh"><b>${t.icon} ${esc(t.name)}</b><button class="back" id="bk">← Теми</button></div>
    <div class="meta"><span>Питання ${i+1} з ${qs.length}</span><span>Правильно: ${ok}</span></div>
    <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
    ${q.img?`<img class="qi" src="${q.img}" alt="Малюнок до питання">`:""}<p class="q">${esc(q.q)}</p><div class="opts">${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>
    <div class="react" id="rc" aria-live="polite"></div><div class="row" id="nx"></div></section>`;
    qq("#bk").onclick=()=>themes();

      if(good){ok++;run++;const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,run>2?24:14,fx);
        rc.innerHTML=`<span>${rnd(PH)}${run>1?` Серія: ${run} 🔥`:""}</span>`;rc.className="react pop yes"}
      else{b.classList.add("bad");run=0;rc.innerHTML="<span>Не цього разу. Правильна відповідь підсвічена.</span>";rc.className="react pop"}
      const n=document.createElement("button");n.className="btn";n.textContent=i+1<qs.length?"Далі":"Показати результат";
      n.onclick=()=>{i++;show()};qq("#nx").appendChild(n);n.focus();
    });
  })();
  function finish(){
    const k="best:"+t.key,prev=store.get(k);if(ok>prev)store.set(k,ok);
    const perfect=ok==qs.length,msg=perfect?"Бездоганно!":ok>=qs.length*.8?"Чудовий результат":ok>=qs.length*.6?"Непогано":"Спробуйте ще раз";
    Q.innerHTML=`<section class="stage end" style="${t.st}"><div class="big">${perfect?"🏆":t.icon}</div><div class="big">${ok}/${qs.length}</div><h2>${msg}</h2><p class="sub">Тема: ${esc(t.name)}${ok>prev?" · новий рекорд":""}</p>

}

    <td class="ic">${r[5]?`<img class="th" src="${r[5]}" alt="Малюнок"><button class="back" data-ri="${y}" aria-label="Прибрати малюнок">✕</button>`:`<label class="imgb">🖼 Малюнок<input type="file" accept="image/*" hidden data-im="${y}"></label>`}</td>
    <td><button class="back" data-d="${y}" aria-label="Видалити рядок ${y+1}">✕</button></td></tr>`).join("")}</tbody></table></div></div>
    <div class="row"><button class="btn ghost" id="ar">＋ Додати рядок</button><button class="btn ghost" id="pt">Вставити з таблиці</button><button class="btn ghost" id="cv">Таблиця у CSV</button></div>
    ${ed.paste?`<div class="f" style="margin-top:12px"><label for="pa">Скопіюйте клітинки з Excel або Google Таблиць і вставте сюди. Колонки: питання, правильна відповідь, хибні відповіді.</label><textarea id="pa" rows="5"></textarea><div><button class="btn" id="po">Додати в таблицю</button></div></div>`:""}

    qq("#en").oninput=e=>ed.name=e.target.value;

    qq("#sv").onclick=save;
    if(qq("#dl"))qq("#dl").onclick=()=>{if(!ed.sure){ed.sure=true;draw();return}C.splice(ci,1);saveC();themes()};
  }
  function save(){
    const rows=ed.rows.filter(r=>r.some(v=>v.trim()));ed.bad=[];
    rows.forEach(r=>{if(!r[0].trim()||!r[1].trim()||!r.slice(2,5).some(v=>v.trim()))ed.bad.push(ed.rows.indexOf(r))});
    if(ed.bad.length){ed.msg="Заповніть питання, правильну й хоча б одну хибну відповідь у підсвічених рядках.";return draw()}
    if(rows.length<3){ed.msg="Потрібно щонайменше 3 питання.";return draw()}
    const o={name:ed.name.trim()||"Моя тема",icon:ed.icon,color:ed.color,qs:rows.map(r=>({q:r[0].trim(),o:[r[1].trim(),...r.slice(2,5).map(v=>v.trim()).filter(Boolean)],...(r[5]?{img:r[5]}:{})}))};
    if(ci!=null)C[ci]=o;else C.push(o);
    themes(saveC()?"":"Тему збережено лише до закриття сторінки: у браузері бракує місця (мабуть, багато малюнків). Збережіть її у файл.");
  }

      if(pinch&&pinch.d>0&&d>0){const m=toSvg({clientX:(a.clientX+b.clientX)/2,clientY:(a.clientY+b.clientY)/2});zoomAt(pinch.d/d,m[0],m[1])}
      pinch={d};return}
    if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;
    if(drag.moved){v.x=drag.vx-dx*px();v.y=drag.vy-dy*px();apply()}});
  mb.addEventListener("pointerup",e=>{const had=P.delete(e.pointerId);
    if(pinch){if(!P.size)pinch=null;drag=null;return}
    if(!drag||!had)return;const was=drag;drag=null;if(was.moved)return;
    const[sx,sy]=toSvg(e),lon=Math.max(-180,Math.min(180,sx-180)),lat=Math.max(-90,Math.min(90,90-sy));
    if(onPick(lon,lat))put(gp,lon,lat)});
  mb.addEventListener("pointercancel",e=>{P.delete(e.pointerId);drag=null;pinch=null});
  const put=(el,lon,lat)=>{el.setAttribute("cx",lon+180);el.setAttribute("cy",90-lat);el.setAttribute("visibility","visible")};
  if("ResizeObserver" in window)new ResizeObserver(apply).observe(mb);
  return{setView,world:()=>setView(180,90,360),ukraine:()=>setView(211.3,41.4,20),
    pin:(lon,lat)=>put(gp,lon,lat),target:(lon,lat)=>put(tp,lon,lat),
    link:(a,b,c,d)=>{ln.setAttribute("x1",a+180);ln.setAttribute("y1",90-b);ln.setAttribute("x2",c+180);ln.setAttribute("y2",90-d);ln.setAttribute("visibility","visible")},
    river:d=>{hl.setAttribute("d",d);hl.setAttribute("visibility","visible")},
    terr:(lon,lat,r)=>{if(r>0){tr.setAttribute("cx",lon+180);tr.setAttribute("cy",90-lat);tr.setAttribute("rx",Math.min(180,r/(111.32*Math.max(.05,Math.cos(rad(lat))))));tr.setAttribute("ry",r/110.57);tr.setAttribute("visibility","visible")}else tr.setAttribute("visibility","hidden")},
    clear:()=>[gp,tp,ln,hl,tr].forEach(x=>x.setAttribute("visibility","hidden"))};
}

function startGeo(mode){
  if(mode=="m"&&!CM.length)return geoMenu("Спочатку створіть хоча б одне питання на карті.");
  const pool=mode=="m"?CM.map(m=>({k:"m",n:m.n,c:m.c,x:m.x,y:m.y,r:m.r})):POOL.filter(p=>mode=="ua"?(p.ua||p.only):(!p.only&&(mode=="mix"||p.k==mode)));
  const rounds=sh(pool).slice(0,5),UAM=mode=="ua";let r=0,total=0,guess=null,done=false;
  G.innerHTML=`<div class="meta"><span id="gi"></span><span class="score" id="gs"></span></div>
  <div class="clue"><small id="ck"></small><b id="cl"></b><span class="hint" id="ch"></span></div>${mapBox()}
  <div class="res" id="rs"></div><div class="row"><button class="btn" id="go" disabled>Вгадати</button></div>`;
  const go=gg("#go");
  const M=mapInit((lon,lat)=>{if(done)return false;guess=[lon,lat];go.disabled=false;return true});
  function round(){
    const p=rounds[r];guess=null;done=false;M.clear();UAM?M.ukraine():M.world();
    gg("#gi").textContent=`Раунд ${r+1} з ${rounds.length}`;gg("#gs").textContent=`Очки: ${total}`;
    gg("#ck").textContent=ASK[p.k];gg("#cl").textContent=p.k=="r"?"Річка "+p.n:p.c;gg("#ch").textContent=p.k=="r"?p.c:"";
    gg("#rs").innerHTML='<span style="color:var(--mute)">Торкніться карти, щоб поставити мітку. Колесо миші, щипок пальцями або +/− змінюють масштаб, перетягування рухає карту.</span>';
    go.textContent="Вгадати";go.disabled=true;go.onclick=check;
  }
  function check(){
    const p=rounds[r];let d,at;done=true;
    if(p.k=="r"){const m=near(guess,RV[p.i][3]);d=m[0];at=m[1];M.river(lineOf(RV[p.i][2]))}
    else{d=dist(guess[0],guess[1],p.x,p.y);at=[p.x,p.y];if(p.k=="m"&&p.r>0){M.terr(p.x,p.y,p.r);d=Math.max(0,d-p.r)}}
    const sc=UAM?200:p.k=="r"?600:p.k=="m"?500+p.r:1500,pt=Math.round(5000*Math.exp(-Math.max(0,d-(UAM?5:15))/sc));total+=pt;
    M.target(at[0],at[1]);M.link(guess[0],guess[1],at[0],at[1]);
    const km=Math.round(d).toLocaleString("uk");
    gg("#rs").innerHTML=p.k=="r"?`<b>Річка ${esc(p.n)}</b>: ваша мітка за ${km} км від русла, це ${pt} з 5000 очок.`
      :`<b>${esc(p.n)}</b>: ${d==0&&p.k=="m"&&p.r?"ви потрапили в потрібну територію":`ви схибили на ${km} км`}, це ${pt} з 5000 очок.`;
    gg("#gs").textContent=`Очки: ${total}`;
    go.textContent=r+1<rounds.length?"Далі":"Показати підсумок";go.onclick=()=>{r++;r<rounds.length?round():end()};
  }
  function end(){
    const k="best:geo:"+mode,prev=store.get(k);if(total>prev)store.set(k,total);const max=rounds.length*5000;
    const m=total>=max*.8?"Ви справжній географ":total>=max*.5?"Добре знаєте карту":total>=max*.25?"Непогано, є куди рости":"Карта поки дається нелегко";
    G.innerHTML=`<div class="end"><div class="big">${total}</div><h2>${m}</h2><p class="sub">з ${max.toLocaleString("uk")} · рекорд: ${Math.max(prev,total)}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="ga">Грати ще</button><button class="btn ghost" id="gb">Інший режим</button></div></div>`;
    gg("#ga").onclick=()=>startGeo(mode);gg("#gb").onclick=()=>geoMenu();
    if(total>=max*.8)burst(innerWidth/2,innerHeight*.3,26,["🎉","⭐","🌍"]);
  }
  round();
}

function mapEd(i){
  const s=i!=null?CM[i]:null,ed={n:s?s.n:"",c:s?s.c:"",x:s?s.x:null,y:s?s.y:null,r:s?s.r:100,msg:"",sure:false};
  draw();
  function draw(){
    G.innerHTML=`<section class="stage" style="${cust("#0c8599","📍")}"><div class="sh"><b>📍 ${i!=null?"Редагування питання":"Нове питання на карті"}</b><button class="back" id="bk">← Скасувати</button></div>
    <div class="f"><label for="mq">Питання або підказка</label><input type="text" id="mq" maxlength="200" value="${esc(ed.c)}" placeholder="Наприклад, де знаходиться наша школа?"></div>
    <div class="f"><label for="mnm">Назва місця (з'явиться після відповіді)</label><input type="text" id="mnm" maxlength="40" value="${esc(ed.n)}" placeholder="Наприклад, Ужгород"></div>
    <div class="f"><span>Торкніться карти, щоб позначити правильне місце</span>${mapBox()}</div>
    <div class="f"><label for="rr">Територія, де відповідь вважається правильною: радіус <b id="rv">${ed.r}</b> км</label><input type="range" id="rr" min="0" max="1500" step="10" value="${ed.r}"></div>
    <div class="react err" id="em" role="alert">${ed.msg}</div>
    <div class="row"><button class="btn" id="sv2">Зберегти питання</button>${i!=null?`<button class="btn ghost" id="dl">${ed.sure?"Точно видалити?":"Видалити питання"}</button>`:""}</div></section>`;
    const M=mapInit((lon,lat)=>{ed.x=lon;ed.y=lat;M.terr(lon,lat,ed.r);return true});
    if(ed.x!=null){M.pin(ed.x,ed.y);M.terr(ed.x,ed.y,ed.r);M.setView(ed.x+180,90-ed.y,Math.max(20,Math.min(360,ed.r/50)))}else M.world();
    gg("#mq").oninput=e=>ed.c=e.target.value;gg("#mnm").oninput=e=>ed.n=e.target.value;
    gg("#rr").oninput=e=>{ed.r=+e.target.value;gg("#rv").textContent=ed.r;if(ed.x!=null)M.terr(ed.x,ed.y,ed.r)};
    gg("#bk").onclick=()=>geoMenu();
    gg("#sv2").onclick=()=>{
      if(!ed.c.trim()){ed.msg="Напишіть питання або підказку.";return draw()}
      if(ed.x==null){ed.msg="Позначте правильне місце на карті.";return draw()}
      const o={n:ed.n.trim()||"Місце",c:ed.c.trim(),x:+ed.x.toFixed(3),y:+ed.y.toFixed(3),r:ed.r};
      if(i!=null)CM[i]=o;else CM.push(o);
      geoMenu(saveM()?"":"Питання збережено лише до закриття сторінки. Збережіть його у файл.")};
    if(gg("#dl"))gg("#dl").onclick=()=>{if(!ed.sure){ed.sure=true;draw();return}CM.splice(i,1);saveM();geoMenu()};
  }
}

  const o=$("#opts");
  o.innerHTML=`<div class="f"><span>Стиль сайту</span><div class="pick">${[["modern","Сучасний"],["xp","Windows XP"]].map(s=>`<button class="pk ${SET.skin==s[0]?"on":""}" data-s="${s[0]}">${s[1]}</button>`).join("")}</div></div>
  <div class="f"><span>Фон сайту (діє в усіх квізах)</span><div class="pick">${BG.map(b=>`<button class="pk ${SET.bg==b[0]?"on":""}" data-b="${b[0]}"><i class="sw2" style="background:${b[0]=="auto"?"linear-gradient(90deg,#e9f1f4 50%,#0d1b28 50%)":`var(--pg-${b[0]})`}"></i>${b[1]}</button>`).join("")}</div></div>`;
  o.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{SET.skin=b.dataset.s;if(SET.skin=="xp"&&SET.bg=="auto")SET.bg="bliss";applySet();drawOpts()});
  o.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{SET.bg=b.dataset.b;applySet();drawOpts()});
}
const togOpts=()=>{const o=$("#opts");o.hidden=!o.hidden;if(!o.hidden){drawOpts();o.scrollIntoView({block:"nearest"})}};
$("#op").onclick=togOpts;$("#st").onclick=togOpts;
const clk=()=>{$("#clk").textContent=new Date().toLocaleTimeString("uk",{hour:"2-digit",minute:"2-digit"})};clk();setInterval(clk,20000);
applySet();
</script>

</body>
</html>
